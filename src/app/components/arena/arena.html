<div class="w-screen h-screen">
  <!-- Small screen warning -->
  <div class="lg:hidden h-full">
    <div class="container bg-gray-600 rounded-2xl mx-auto my-20">
      <h1 class="text-4xl">Screen size too small, please get a bigger monitor</h1>
    </div>
  </div>
  <!-- Arena -->
  <div class="hidden lg:block h-full relative">
    <div class="absolute top-0 left-0 w-full h-xs bg-gray-300" cdkDropList [cdkDropListConnectedTo]="handList" [cdkDropListData]="spellCasting" [cdkDropListEnterPredicate]="playSpellPredicate" (cdkDropListDropped)="spellHitBoss($event)">
      <div class="bg-red-500 h-10 border mx-auto w-8/10 justify-center space-y-5  border-gray-800">
        <p class="text-center">100/100</p>
      </div>
      <p class="text-center text-2xl">Enemy name</p>
    </div>
    <div class="h-10/12 bottom-0 absolute w-full">
      <!-- Board -->
      <div class="container mx-auto flex justify-center flex-nowrap space-y-5 w-full h-7/12 bg-gray-300" id="playerBoard"
        cdkDropList [cdkDropListData]="playerBoard" #boardList="cdkDropList" cdkDropListOrientation="horizontal" [cdkDropListConnectedTo]="handList"
        (cdkDropListDropped)="drop($event)" >
          @for (card of playerBoard; track $index) {
              <app-card [card]="card" ></app-card>
          }

      </div>
      <!-- Hand -->
      <div class="container mx-auto flex justify-center flex-nowrap space-y-5 w-full h-5/12 bg-gray-400" id="playerHand"
        cdkDropListSortingDisabled cdkDropList #handList="cdkDropList" cdkDropListOrientation="horizontal" [cdkDropListData]="hand" [cdkDropListConnectedTo]="boardList"
        (cdkDropListDropped)="drop($event)" [cdkDropListEnterPredicate]="noReturnPredicate">
        @for (card of hand; track $index) {
        <!-- <div cdkDrag [cdkDragData]="card" class="p-2 bg-blue-400 m-1 ">{{card.title}} - {{card.type}}</div> -->
          <app-card [card]="card" cdkDrag [cdkDragData]="card">
            @if (card.type == "spell") {
              <div *cdkDragPreview>
                <app-spell [spell]="card"></app-spell>
              </div>
              <div *cdkDragPlaceholder>

              </div>
            }
          </app-card>
        }
      </div>
    </div>
  </div>

</div>
